name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/sap-inventory-transfer-generator-6t2gmj
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # The build is one self-contained dist/index.html (see vite.config.ts) — also
      # published as a plain workflow artifact so it can be downloaded from the Actions
      # run and handed directly to colleagues whose network blocks *.github.io, no
      # hosting needed at all: they just double-click the file.
      - uses: actions/upload-artifact@v4
        with:
          name: kcell-stock-optimizer-offline
          path: dist/index.html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
